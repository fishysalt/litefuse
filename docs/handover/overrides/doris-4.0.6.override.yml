# ── Provenance (added when this file was archived into the repo for the macOS handover) ──
# Original location: OUTSIDE the repo, on the Windows dev host, as `_doris406.override.yml`
# (the repo-external working directory, i.e. the parent of the repository folder).
# Note: the Doris containers that were actually running were started with a *copy* of this
# file placed in the Windows %TEMP% directory (see docker inspect's
# com.docker.compose.project.config_files label). That temp copy is transient and has already
# been deleted, so this archived file is now the only durable copy.
# Changes vs. the original: the filename in the `docker compose -f ...` example line below was
# updated to the archived name, and this provenance block was added. The image pins — the
