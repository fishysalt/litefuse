# ─────────────────────────────────────────────────────────────────────────────────────────
# Local-only override: run the dev Doris with 4.0.6 (the version the app is
# verified against, and the one the main docker-compose.yml pins) instead of the
# stale 4.0.4 images in docker-compose.dev.yml. 4.0.4 lacks JSON_OBJECT_FLATTEN,
# which the Doris read path (traces / observations / events) requires.
#
#   docker compose -f docker-compose.dev.yml -f docs/handover/overrides/doris-4.0.6.override.yml up -d doris_fe doris_be
services:
  doris_fe:
    image: apache/doris:fe-4.0.6
  doris_be:
    image: apache/doris:be-4.0.6
